name: Validate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          dups=$(jq -r '[.[].id] | group_by(.) | map(select(length > 1)[0]) | join(", ")' collection.json)
          marker='<!-- duplicate-id -->'
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id")
          [ -z "$dups" ] && [ -n "$id" ] && gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/$id"
          [ -z "$dups" ] && exit 0
          body="${marker}
          **Duplicate id:** ${dups}"
          [ -z "$id" ] && gh pr comment "$PR" --body "$body"
          [ -n "$id" ] && gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/$id" -f body="$body"
          exit 1
